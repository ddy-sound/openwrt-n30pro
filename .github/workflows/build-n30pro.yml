name: Build Netcore N30 Pro closed-source Wi-Fi firmware

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: Enable tmate debugging
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: n30pro-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  SOURCE_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
  DEVICE_PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git
  DEVICE_PATCH_COMMIT: f8be85f26ce88f435389a112d9196a8159503ff2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Clone pinned source and device adaptation
        run: |
          git clone --branch "$SOURCE_BRANCH" --single-branch --filter=blob:none "$SOURCE_REPO" openwrt
          git -C openwrt checkout "$SOURCE_COMMIT"
          git clone --filter=blob:none "$DEVICE_PATCH_REPO" n30pro-patch
          git -C n30pro-patch checkout "$DEVICE_PATCH_COMMIT"
          printf 'Source: '; git -C openwrt rev-parse HEAD
          printf 'Device patch: '; git -C n30pro-patch rev-parse HEAD

      - name: Apply N30 Pro support and proprietary mt_wifi adaptation
        working-directory: openwrt
        run: |
          bash ../n30pro-patch/scripts/apply-netcore-n30pro.sh ../n30pro-patch
          dts=target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts
          mk=target/linux/mediatek/image/filogic.mk
          sed -i 's/#include "mt7981b\.dtsi"/#include "mt7981.dtsi"/' "$dts"
          sed -i '/nvmem-cell-names = "eeprom";/d; /nvmem-cells = <&eeprom_factory_0>;/d' "$dts"
          sed -i '/&wifi {/a\	mediatek,mtd-eeprom = <&factory 0x0>;' "$dts"
          sed -i '/define Device\/netcore_n30-pro/,/endef/ s/kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware //' "$mk"
          grep -q 'mediatek,mtd-eeprom = <&factory 0x0>;' "$dts"
          grep -q '#include "mt7981.dtsi"' "$dts"
          ! sed -n '/define Device\/netcore_n30-pro/,/endef/p' "$mk" | grep -q 'kmod-mt7915e'
          grep -A18 'define Device/netcore_n30-pro' "$mk"
          grep -A5 '&wifi' "$dts"

      - name: Add feeds and customize defaults
        working-directory: openwrt
        run: |
          bash "$GITHUB_WORKSPACE/scripts/diy-script.sh"
          ./scripts/feeds update -a
          sed -i 's/ci-llvm=true/ci-llvm=false/g' feeds/packages/lang/rust/Makefile || true
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/diy-6.6.sh"

      - name: Generate and verify build configuration
        working-directory: openwrt
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_.*_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_.*_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_MULTI_PROFILE=/d' .config
          cat "$GITHUB_WORKSPACE/configs/6.6.txt" >> .config
          make defconfig
          echo 'Resolved target, Wi-Fi and requested package configuration:'
          grep -E 'TARGET_(mediatek|DEVICE_).*netcore|TARGET_mediatek|PACKAGE_(kmod-mt_wifi|kmod-mt7915e|luci-app-|tailscale)' .config || true

          require_config() {
            if ! grep -q "^$1=y$" .config; then
              echo "Missing required configuration: $1=y" >&2
              exit 1
            fi
          }

          require_config 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n30-pro'
          require_config 'CONFIG_PACKAGE_kmod-mt_wifi'
          if grep -q '^CONFIG_PACKAGE_kmod-mt7915e=y$' .config; then
            echo 'Open-source kmod-mt7915e was unexpectedly selected' >&2
            exit 1
          fi
          for p in store openclash turboacc-mtk samba4 ttyd nlbwmon upnp filemanager; do
            require_config "CONFIG_PACKAGE_luci-app-$p"
          done
          require_config 'CONFIG_PACKAGE_tailscale'
          grep -E 'DEVICE_netcore_n30-pro|PACKAGE_kmod-mt_wifi=|PACKAGE_luci-app-(store|openclash|turboacc-mtk|samba4|ttyd|nlbwmon|upnp|filemanager)=|PACKAGE_tailscale=' .config

      - name: Optional tmate debugging
        uses: mxschmitt/action-tmate@v3
        if: github.event.inputs.ssh == 'true'
        with:
          limit-access-to-actor: true

      - name: Restore compiler cache
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: true
          toolchain: true
          mixkey: netcore-n30pro-mtwifi-6.6
          prefix: ${{ github.workspace }}/openwrt

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -print -delete

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect and inspect firmware
        run: |
          out=openwrt/bin/targets/mediatek/filogic
          mkdir -p firmware
          find "$out" -maxdepth 1 -type f \
            \( -name '*netcore_n30-pro*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp -v {} firmware/ \;
          find firmware -maxdepth 1 -type f -print -exec file {} \;
          test -n "$(find firmware -maxdepth 1 -type f -name '*netcore_n30-pro*squashfs-sysupgrade.bin' -print -quit)"
          # OpenWrt already generates the authoritative `sha256sums` file.
          # Do not add a second `SHA256SUMS`: GitHub release asset names are
          # effectively case-insensitive and the two names collide on upload.
          date '+%Y.%m.%d-%H%M' > firmware/BUILD_TAG
          echo "BUILD_TAG=$(cat firmware/BUILD_TAG)" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n30pro-closed-wifi-${{ env.BUILD_TAG }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: n30pro-${{ env.BUILD_TAG }}
          name: Netcore N30 Pro closed-source Wi-Fi ${{ env.BUILD_TAG }}
          generate_release_notes: false
          body: |
            Netcore N30 Pro custom ImmortalWrt firmware.

            - Source: padavanonly/immortalwrt-mt798x-6.6 (`openwrt-24.10-6.6`)
            - Wi-Fi: MediaTek proprietary MT7981/MT7976 `mt_wifi`
            - LAN: 192.168.6.1
            - Initial root password: empty; set it immediately after first login
            - Included: iStore, OpenClash with embedded Meta core, TurboACC/HNAT/WED, ttyd, Samba4/USB storage, nlbwmon, UPnP, file manager, Tailscale and kmod-tun

            Keep a known-good recovery method and the original firmware backup. Do not flash bootloader partitions with these system images.
          files: firmware/*
